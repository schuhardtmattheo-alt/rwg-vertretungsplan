name: Vertretungsplan abrufen

on:
  schedule:
    # Gewünschte deutsche Uhrzeiten:
    #   Mo-Fr 07:20, 07:30, 11:20 (heutiger Plan) und 15:30 (ab da nächster Schultag)
    #   So-Fr 18:00, 20:00 (nächster Schultag)
    # GitHub rechnet in UTC. Deshalb steht jede Zeit zweimal da (Winter = UTC+1, Sommer = UTC+2);
    # der Schritt "Zeit prüfen" lässt nur die passende Variante weiterlaufen.
    # --- Winterzeit (UTC+1) ---
    - cron: "20,30 6 * * 1-5"
    - cron: "20 10 * * 1-5"
    - cron: "30 14 * * 1-5"
    - cron: "0 17,19 * * 0-5"
    # --- Sommerzeit (UTC+2) ---
    - cron: "20,30 5 * * 1-5"
    - cron: "20 9 * * 1-5"
    - cron: "30 13 * * 1-5"
    - cron: "0 16,18 * * 0-5"
  workflow_dispatch: {}   # wird vom "Aktualisieren"-Knopf auf der Webseite ausgelöst

concurrency:
  group: plan
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # nur für den Keep-alive-Schritt unten

jobs:
  abrufen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Berlin
    steps:
      - name: Zeit prüfen (Sommer-/Winterzeit)
        id: zeit
        env:
          ZEITPLAN: ${{ github.event.schedule }}
        run: |
          los=true
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            versatz=$(TZ=Europe/Berlin date +%z)   # +0100 im Winter, +0200 im Sommer
            case "$ZEITPLAN" in
              "20,30 6 * * 1-5"|"20 10 * * 1-5"|"30 14 * * 1-5"|"0 17,19 * * 0-5") soll="+0100" ;;
              *) soll="+0200" ;;
            esac
            if [ "$versatz" != "$soll" ]; then los=false; echo "Falsche Jahreszeit-Variante, überspringe."; fi
          fi
          echo "los=$los" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.zeit.outputs.los == 'true'

      - uses: actions/setup-python@v5
        if: steps.zeit.outputs.los == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        if: steps.zeit.outputs.los == 'true'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # Hinweis: Das Repository ist öffentlich, also auch diese Logs.
      # Deshalb werden hier keine Screenshots hochgeladen und keine Plandetails ausgegeben.
      - name: Plan auslesen
        if: steps.zeit.outputs.los == 'true'
        env:
          RWG_EMAIL: ${{ secrets.RWG_EMAIL }}
          RWG_PASSWORT: ${{ secrets.RWG_PASSWORT }}
          KLASSE: ${{ vars.KLASSE || '9c' }}
        run: python scraper.py

      - name: Auf Cloudflare Pages veröffentlichen
        if: steps.zeit.outputs.los == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KNOPF_GITHUB_TOKEN: ${{ secrets.KNOPF_GITHUB_TOKEN }}
          PROJEKT: ${{ vars.CF_PROJEKT || 'rwg-plan-9c' }}
        run: |
          npx --yes wrangler@4 pages project create "$PROJEKT" --production-branch=main >/dev/null 2>&1 || true
          # Zugang für den "Aktualisieren"-Knopf (nur beim ersten Mal bzw. nach Änderung nötig, schadet aber nicht)
          if [ -n "$KNOPF_GITHUB_TOKEN" ] && [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            printf '%s' "$KNOPF_GITHUB_TOKEN" | npx --yes wrangler@4 pages secret put GH_TOKEN --project-name="$PROJEKT" >/dev/null
            printf '%s' "$GITHUB_REPOSITORY" | npx --yes wrangler@4 pages secret put GH_REPO --project-name="$PROJEKT" >/dev/null
          fi
          npx --yes wrangler@4 pages deploy public --project-name="$PROJEKT" --branch=main --commit-dirty=true

      # GitHub schaltet Zeitpläne in öffentlichen Repos nach 60 Tagen ohne Änderungen ab.
      # Dieser Schritt hält den Workflow aktiv.
      - name: Keep-alive
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/plan.yml/enable" || true
